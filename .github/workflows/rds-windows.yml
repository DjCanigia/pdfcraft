name: RDS Windows build

on:
  push:
    branches: [fix/windows-rds-print-defaults]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rds-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
      PDFCRAFT_BUILD_LABEL: 'custom RDS grayscale long-edge; unsigned'
      PDFCRAFT_VERSION: '0.14.0-rds.1'
      PDFCRAFT_REQUIRE_WINRES: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure MSVC and Windows SDK
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools not found' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\target-rds" >> $env:GITHUB_ENV
          "DIST=$env:GITHUB_WORKSPACE\dist\rds" >> $env:GITHUB_ENV
      - name: Install Rust 1.95.0 and WiX 5.0.2
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=1.95.0" >> $env:GITHUB_ENV
          dotnet tool install wix --tool-path .tools --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.tools" >> $env:GITHUB_PATH
      - name: Checkout release font input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: .build-inputs/craft-fonts
          persist-credentials: false
      - name: Configure font input
        run: |
          "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\.build-inputs\craft-fonts" >> $env:GITHUB_ENV
          "CRAFT_FONTS_REQUIRED=1" >> $env:GITHUB_ENV
      - name: Format candidate and record exact formatting diff
        run: |
          cargo fmt --all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force validation | Out-Null
          git diff --output=validation/rustfmt.patch
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test print dialog defaults and per-job overrides
        run: |
          cargo test --locked --release -p pdfcraft-ui-egui --target x86_64-pc-windows-msvc -j 2 --lib print_ui:: 2>&1 | Tee-Object validation/print-tests.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows x64 application and CLI
        run: |
          cargo build --locked --release -p pdfcraft -p pdfcraft-cli --target x86_64-pc-windows-msvc -j 2 2>&1 | Tee-Object validation/build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\pdfcraft-cli.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check asset licensing and crate boundaries
        run: |
          cargo run --locked --release -p xtask -j 2 -- assets --write
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run --locked --release -p xtask -j 2 -- assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run --locked --release -p xtask -j 2 -- layers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --output=validation/generated-changes.patch
      - name: Create unsigned MSI and portable ZIP
        run: |
          ./packaging/windows/package.ps1 -Arch x64 -SkipBuild
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem $env:DIST -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 500 | Set-Content "$env:DIST\RDS-SHA256.txt"
          @"
          Unofficial unsigned PdfCraft 0.14.0 RDS candidate.
          Source commit: $env:GITHUB_SHA
          Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Automated print-dialog tests ran before build; inspect workflow result.
          No physical printer, RDS/Easy Print or production installer validation is claimed.
          MSI numeric version remains 0.14.0. Test installation/rollback on a VM first.
          "@ | Set-Content "$env:DIST\RDS-BUILD-INFO.txt"
      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PdfCraft-0.14.0-RDS-Windows-x64-unsigned
          path: dist/rds/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RDS-validation-logs
          path: validation/*
          if-no-files-found: ignore
          retention-days: 14
